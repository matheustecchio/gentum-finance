name: Development Windows build

on:
  push:
    branches: [development]

concurrency:
  group: development-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    timeout-minutes: 50
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install PostgreSQL build tools
        run: |
          python -m pip install meson ninja
          choco install winflexbison3 --no-progress --yes
      - run: npm --prefix frontend ci
      - name: Build Windows installer
        run: npm --prefix frontend run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-development
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
