name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend-checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build -o bin/gentum-backend ./cmd/desktop
      - run: go build -o bin/gentum-test-server ./cmd/test-server
  backend-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: gentum_test
          POSTGRES_USER: gentum
          POSTGRES_PASSWORD: gentum_test_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gentum -d gentum_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...
        env:
          GENTUM_TEST_DATABASE_URL: postgres://gentum:gentum_test_only@localhost:5432/gentum_test?sslmode=disable
  frontend-checks:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  frontend-tests:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
  end-to-end:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: sudo apt-get update && sudo apt-get install -y build-essential bison flex perl patchelf
      - run: python3 scripts/prepare-desktop.py
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 7
  desktop-linux:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install native build and test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex perl patchelf dbus-x11 libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev webkit2gtk-driver xvfb xauth
          rustup update stable --no-self-update
          rustup default stable
      - run: npm --prefix frontend ci
      - run: python3 scripts/prepare-desktop.py
      - run: cargo test --locked --manifest-path desktop/Cargo.toml
      - name: Test managed PostgreSQL and private IPC
        run: |
          GENTUM_DESKTOP_POSTGRES_DIR="$GITHUB_WORKSPACE/desktop/resources/postgres" go -C backend test -race -tags=integration ./internal/desktop
          node scripts/desktop-check.mjs
      - run: npm --prefix frontend run desktop:build
      - run: cargo install tauri-driver --version 2.1.0 --locked
      - run: dbus-run-session -- node scripts/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-desktop
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/native-smoke.png
          retention-days: 7
  website-checks:
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 website/build.py
