name: gentum-finance
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${GENTUM_DATABASE_NAME:-gentum_finance}
      POSTGRES_USER: ${GENTUM_DATABASE_USERNAME:-gentum}
      POSTGRES_PASSWORD: ${GENTUM_DATABASE_PASSWORD:-gentum_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - gentum-postgres-data:/var/lib/postgresql/data
    networks: [private]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      GENTUM_DATABASE_HOST: postgres
      GENTUM_DATABASE_NAME: ${GENTUM_DATABASE_NAME:-gentum_finance}
      GENTUM_DATABASE_USERNAME: ${GENTUM_DATABASE_USERNAME:-gentum}
      GENTUM_DATABASE_PASSWORD: ${GENTUM_DATABASE_PASSWORD:-gentum_dev_only}
      GENTUM_SERVER_ADDRESS: 0.0.0.0
      GENTUM_FRONTEND_ORIGIN: http://localhost:${GENTUM_PORT:-5173}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${GENTUM_PORT:-5173}:80"
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [private]
    restart: unless-stopped
networks:
  private:
volumes:
  gentum-postgres-data:
    name: ${GENTUM_DATABASE_VOLUME:-gentum-finance_gentum-postgres-data}
